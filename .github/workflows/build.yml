name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --stacktrace
      - name: Inspect APIs
        continue-on-error: true
        run: |
          set +e
          JARS=$(find ~/.gradle -name '*.jar' -size +1M 2>/dev/null)
          find_jar() { for j in $JARS; do if unzip -l "$j" 2>/dev/null | grep -q "$1"; then echo "$j"; return; fi; done; }
          show() { jar=$(find_jar "$1.class"); echo "=== $1 in $jar"; [ -n "$jar" ] && javap -public -cp "$jar" "$(echo $1 | tr / .)" | head -${2:-80}; }
          show net/minecraft/client/render/RenderLayer 120
          show net/minecraft/client/render/VertexRendering 40
          show net/minecraft/client/gl/RenderPipelines 120
          show net/minecraft/client/render/state/WorldRenderState 40
          show net/fabricmc/fabric/api/client/rendering/v1/WorldRenderEvents 40
          show net/fabricmc/fabric/api/client/rendering/v1/WorldRenderContext 40
          show net/minecraft/client/world/ClientWorld 200
          show net/minecraft/client/render/VertexConsumerProvider 30
          show net/minecraft/client/gl/RenderPipelines
      - uses: actions/upload-artifact@v4
        with:
          name: basefinder-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/basefinder-*.jar | grep -v sources | head -n1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "BaseFinder (latest build)" --notes "Нужен Fabric API. Minecraft 1.21.11."
